services:
  app:
    build: .
    container_name: prog05-app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - ./server/apache2.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: prog05-db
    restart: always
    env_file:
      - .env
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  tailwind:
    image: node:20
    container_name: prog05-tailwind
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npx tailwindcss -i ./src/input.css -o ./public/assets/css/style.css --watch"

volumes:
  db_data:
  storage_data: